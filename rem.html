<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECWATCH // PARALYSIS DECKBUILDER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root {
    --g: #4dff91; --gdim: #1a5c1a; --red: #ff2020; --amb: #ffaa00;
    --bg: #020202; --card-bg: #070a07;
  }
  body {
    background: var(--bg); color: var(--g); font-family: 'Share Tech Mono', monospace;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column; user-select: none;
  }
  
  body::after {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 100%);
    pointer-events: none; z-index: 100;
  }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 99;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px);
  }

  /* Top HUD */
  #hud {
    padding: 20px 40px; display: flex; justify-content: space-between;
    border-bottom: 1px solid var(--gdim); z-index: 10; background: #000;
  }
  .stat { font-size: 24px; letter-spacing: 0.1em; text-shadow: 0 0 10px var(--g); transition: color 0.3s; }
  .stat.red { color: var(--red); text-shadow: 0 0 10px var(--red); }
  .stat.amber { color: var(--amb); text-shadow: 0 0 10px var(--amb); }

  /* ENTITY VIEWPORT */
  #entity-viewport {
    width: 320px; height: 140px; margin: 20px auto 0;
    background: #000; border: 2px solid var(--reddim, #5c1a1a); 
    box-shadow: 0 0 30px rgba(255,0,0,0.1), inset 0 0 20px rgba(255,0,0,0.2);
    border-radius: 8px; position: relative; z-index: 10; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .viewport-label { position: absolute; top: 5px; left: 10px; font-size: 10px; color: var(--red); letter-spacing: 0.2em; z-index: 2; }

  /* 3D Play Area */
  #table-container {
    flex: 1; perspective: 1200px; display: flex; align-items: center; justify-content: center;
    position: relative; margin-top: -80px; z-index: 5;
  }
  #table {
    width: 800px; height: 500px; transform: rotateX(55deg) translateZ(-50px);
    transform-style: preserve-3d; display: flex; flex-direction: column; gap: 40px; justify-content: center;
    background: radial-gradient(circle at center, rgba(26,92,26,0.1) 0%, transparent 60%);
    border: 1px dashed rgba(77,255,145,0.1); border-radius: 20px; padding: 40px;
  }

  .row { display: flex; justify-content: center; gap: 20px; }
  
  .board-slot {
    width: 140px; height: 200px; border: 2px dashed var(--gdim); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; color: var(--gdim);
    transition: all 0.2s; cursor: pointer; position: relative;
  }
  .board-slot.highlight { background: rgba(255,170,0,0.1); border-color: var(--amb); box-shadow: inset 0 0 20px rgba(255,170,0,0.2); color: var(--amb); }

  /* Cards */
  .card {
    width: 140px; height: 200px; background: var(--card-bg);
    border: 2px solid var(--gdim); border-radius: 8px;
    display: flex; flex-direction: column; position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,255,0,0.05);
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow: hidden;
  }
  .card-art { height: 80px; background: rgba(0,255,0,0.05); border-bottom: 1px solid var(--gdim); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--gdim); background-size: cover; background-position: center; }
  
  .card.enemy { border-color: var(--red); box-shadow: 0 10px 30px rgba(255,0,0,0.1), inset 0 0 20px rgba(255,0,0,0.05); }
  .card.enemy .card-art { border-color: var(--red); color: var(--red); background: rgba(255,0,0,0.05); font-size: 40px; }
  .card.enemy .stats { background: rgba(255,0,0,0.1); border-top: 1px solid var(--red); padding: 8px; display: flex; justify-content: space-between; color: var(--red); font-weight: bold; position: absolute; bottom: 0; width: 100%;}
  .intent { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); font-size: 20px; color: var(--red); background: #000; padding: 5px 10px; border: 1px solid var(--red); border-radius: 5px; }

  /* Player Hand & Deck HUD */
  #action-bar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 800px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 50;
  }
  
  .pile {
    width: 100px; height: 140px; border: 2px solid var(--gdim); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
    background: rgba(0,20,0,0.8); text-align: center; font-weight: bold;
    box-shadow: 0 10px 20px rgba(0,0,0,0.8);
  }
  
  #btn-end-turn {
    background: var(--reddim); color: var(--red); border: 2px solid var(--red);
    padding: 15px 30px; font-family: inherit; font-size: 18px; font-weight: bold;
    cursor: pointer; letter-spacing: 0.2em; border-radius: 4px; transition: 0.2s;
    text-shadow: 0 0 10px var(--red); box-shadow: 0 0 20px rgba(255,0,0,0.1);
  }
  #btn-end-turn:hover:not(:disabled) { background: var(--red); color: #000; box-shadow: 0 0 30px var(--red); }
  #btn-end-turn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }

  #player-hand { display: flex; gap: -10px; position: absolute; left: 50%; transform: translateX(-50%); bottom: -20px; }
  #player-hand .card { width: 150px; height: 220px; border-color: var(--g); cursor: pointer; transform-origin: bottom center; margin: 0 -15px; background: #000; }
  
  #player-hand .card:nth-child(1) { transform: rotate(-8deg) translateY(20px); }
  #player-hand .card:nth-child(2) { transform: rotate(-3deg) translateY(5px); }
  #player-hand .card:nth-child(3) { transform: rotate(3deg) translateY(5px); }
  #player-hand .card:nth-child(4) { transform: rotate(8deg) translateY(20px); }
  
  #player-hand .card:hover:not(.selected) { transform: translateY(-40px) rotate(0deg) scale(1.05); z-index: 100; box-shadow: 0 0 30px rgba(77,255,145,0.2); background: var(--card-bg); }
  #player-hand .card.selected { transform: translateY(-60px) rotate(0deg) scale(1.1); z-index: 110; border-color: var(--amb); box-shadow: 0 0 40px rgba(255,170,0,0.3); }
  #player-hand .card.selected .card-cost { background: var(--amb); color: #000; }

  .card-title { font-size: 13px; font-weight: bold; text-align: center; padding: 6px; border-bottom: 1px dashed var(--gdim); letter-spacing: 0.1em; background: rgba(0,0,0,0.5); }
  .card-cost { position: absolute; top: 5px; left: 5px; background: var(--g); color: #000; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; border: 2px solid #000; z-index: 5;}
  .card-desc { font-size: 11px; padding: 10px; color: #aaa; flex: 1; line-height: 1.3; text-align: center; }
  .card-dmg { font-size: 16px; font-weight: bold; text-align: center; padding: 8px; color: var(--g); text-shadow: 0 0 10px var(--g); background: rgba(0,255,0,0.05); border-top: 1px solid var(--gdim); }

  .glitch { animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both; color: var(--red) !important; text-shadow: 0 0 10px var(--red) !important; }
  @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
  .shake-heavy { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
</style>
</head>
<body>

<div class="scanlines"></div>

<div id="hud">
  <div class="stat" id="stat-hp">LUCIDITY: 12/20</div>
  <div class="stat amber" id="stat-energy">REM ENERGY: 3/3</div>
  <div class="stat red" id="stat-boss">THE ENTITY: 40/40</div>
</div>

<div id="entity-viewport">
  <div class="viewport-label">SYS.CAM.01 // FEED ACTIVE</div>
  <div style="color:var(--reddim); font-size: 12px; text-align:center;">[ AWAITING VISUAL FEED ]</div>
</div>

<div id="table-container">
  <div id="table">
    
    <div class="row" id="enemy-row">
      </div>

    <div class="row" id="player-board">
      <div class="board-slot" onclick="playCard(0)">[ EMPTY ]</div>
      <div class="board-slot" onclick="playCard(1)">[ EMPTY ]</div>
      <div class="board-slot" onclick="playCard(2)">[ EMPTY ]</div>
    </div>

  </div>
</div>

<div id="action-bar">
  <div class="pile" id="draw-pile">DRAW<br>0</div>
  <div id="player-hand"></div>
  <button id="btn-end-turn" onclick="endTurn()">END TURN</button>
  <div class="pile" id="discard-pile">DISCARD<br>0</div>
</div>

<script>
  // --- Game State ---
  let state = {
    energy: 3, maxEnergy: 3, hp: 12, maxHp: 20, entityHp: 40,
    selectedCardIndex: null, isEnemyTurn: false,
    
    // Master Deck List
    deck: [
      { id: 'c1', cost: 1, type: 'atk', title: 'LASH OUT', desc: 'Strike the Terror in this lane.', val: 4, art: '' },
      { id: 'c1b', cost: 1, type: 'atk', title: 'LASH OUT', desc: 'Strike the Terror in this lane.', val: 4, art: '' },
      { id: 'c2', cost: 2, type: 'skill', title: 'LUCID DREAM', desc: 'Regain 2 Lucidity.', val: 2, art: '' },
      { id: 'c3', cost: 1, type: 'def', title: 'BRACE', desc: 'Deploy a mental block (5 HP).', val: 5, hp: 5, art: '' },
      { id: 'c3b', cost: 1, type: 'def', title: 'BRACE', desc: 'Deploy a mental block (5 HP).', val: 5, hp: 5, art: '' },
      { id: 'c4', cost: 0, type: 'skill', title: 'SCREAM', desc: 'Cost 0. Shift a terror.', val: 0, art: '' }
    ],
    drawPile: [], discardPile: [], hand: [],
    
    board: [null, null, null], // Player lanes
    enemies: [
      { name: 'LURKER', atk: 4, hp: 8, symbol: '⏣', intent: '⚠️ 4' },
      null, // Empty middle lane
      { name: 'BLOCKER', atk: 0, hp: 12, symbol: '⎔', intent: '🛡️' }
    ]
  };

  const handEl = document.getElementById('player-hand');
  const slots = document.querySelectorAll('.board-slot');
  const enemyRow = document.getElementById('enemy-row');

  // Utility Sleep
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // --- Initialization ---
  function initBattle() {
    // Copy deck to draw pile and shuffle
    state.drawPile = [...state.deck].sort(() => Math.random() - 0.5);
    state.discardPile = [];
    state.hand = [];
    
    updateHUD();
    renderEnemies();
    startTurn();
  }

  // --- Turn Mechanics ---
  function startTurn() {
    state.energy = state.maxEnergy;
    state.isEnemyTurn = false;
    document.getElementById('btn-end-turn').disabled = false;
    
    drawCards(4); // Draw 4 cards per turn
    updateHUD();
  }

  function drawCards(amount) {
    for (let i = 0; i < amount; i++) {
      if (state.drawPile.length === 0) {
        if (state.discardPile.length === 0) break; // No cards left anywhere!
        // Reshuffle discard into draw
        state.drawPile = [...state.discardPile].sort(() => Math.random() - 0.5);
        state.discardPile = [];
        // if (typeof JAMengine !== 'undefined') JAMengine.playSFX('shuffle');
      }
      state.hand.push(state.drawPile.pop());
    }
    renderHand();
  }

  async function endTurn() {
    if (state.isEnemyTurn) return;
    state.isEnemyTurn = true;
    document.getElementById('btn-end-turn').disabled = true;
    state.selectedCardIndex = null;

    // Discard remaining hand
    while (state.hand.length > 0) {
      state.discardPile.push(state.hand.pop());
    }
    renderHand();
    updateHUD();

    // Trigger Enemy Actions
    await executeEnemyTurn();

    // Start next round
    startTurn();
  }

  async function executeEnemyTurn() {
    for (let i = 0; i < state.enemies.length; i++) {
      let enemy = state.enemies[i];
      if (!enemy || enemy.atk <= 0) continue; // Empty or doesn't attack

      await sleep(600); // Dramatic pause
      
      let playerCard = state.board[i];
      if (playerCard) {
        // Hit the card in the lane!
        document.body.classList.add('shake-heavy');
        setTimeout(() => document.body.classList.remove('shake-heavy'), 300);
        
        playerCard.hp -= enemy.atk;
        if (playerCard.hp <= 0) {
          state.board[i] = null; // Card destroyed
          // if (typeof JAMengine !== 'undefined') JAMengine.playSFX('card_destroy');
        } else {
          // if (typeof JAMengine !== 'undefined') JAMengine.playSFX('hit');
        }
      } else {
        // Direct hit to player HP!
        state.hp -= enemy.atk;
        document.getElementById('stat-hp').classList.add('glitch');
        setTimeout(() => document.getElementById('stat-hp').classList.remove('glitch'), 300);
        // if (typeof JAMengine !== 'undefined') JAMengine.playDamage();
      }
      renderBoard();
      updateHUD();
    }
    await sleep(500);
  }

  // --- UI Rendering ---
  function updateHUD() {
    document.getElementById('stat-hp').innerText = `LUCIDITY: ${state.hp}/${state.maxHp}`;
    document.getElementById('stat-energy').innerText = `REM ENERGY: ${state.energy}/${state.maxEnergy}`;
    document.getElementById('draw-pile').innerHTML = `DRAW<br>${state.drawPile.length}`;
    document.getElementById('discard-pile').innerHTML = `DISCARD<br>${state.discardPile.length}`;
  }

  function renderEnemies() {
    enemyRow.innerHTML = '';
    state.enemies.forEach(e => {
      if (!e) {
        enemyRow.innerHTML += `<div style="width: 140px;"></div>`;
      } else {
        enemyRow.innerHTML += `
          <div class="card enemy">
            <div class="intent">${e.intent}</div>
            <div class="card-art">${e.symbol}</div>
            <div class="card-title">${e.name}</div>
            <div class="stats"><span>ATK: ${e.atk}</span><span>HP: ${e.hp}</span></div>
          </div>`;
      }
    });
  }

  function renderBoard() {
    slots.forEach((slot, index) => {
      let card = state.board[index];
      if (card) {
        slot.innerHTML = `
          <div class="card" style="width: 100%; height: 100%; transform: none; box-shadow: none; border-color: var(--g);">
            <div class="card-title">${card.title}</div>
            <div class="card-art" style="background-image: url('${card.art}');"></div>
            <div class="card-desc">${card.desc}</div>
            <div class="card-dmg" style="color:${card.hp ? 'var(--amb)' : 'var(--g)'};">${card.hp ? 'HP: '+card.hp : 'DMG: '+card.val}</div>
          </div>`;
        slot.style.border = 'none';
      } else {
        slot.innerHTML = '[ EMPTY ]';
        slot.style.border = '';
      }
    });
  }

  function renderHand() {
    handEl.innerHTML = '';
    state.hand.forEach((card, index) => {
      let isSelected = state.selectedCardIndex === index;
      let cardHTML = document.createElement('div');
      cardHTML.className = `card ${isSelected ? 'selected' : ''}`;
      cardHTML.onclick = () => selectCard(index);
      
      cardHTML.innerHTML = `
        <div class="card-cost">${card.cost}</div>
        <div class="card-art" style="background-image: url('${card.art}');">[ ART ]</div>
        <div class="card-title">${card.title}</div>
        <div class="card-desc">${card.desc}</div>
        <div class="card-dmg">${card.type === 'def' ? 'DEF: '+card.val : 'DMG: '+card.val}</div>
      `;
      handEl.appendChild(cardHTML);
    });

    slots.forEach((slot, index) => {
      if (state.selectedCardIndex !== null && state.board[index] === null) {
        slot.classList.add('highlight');
      } else {
        slot.classList.remove('highlight');
      }
    });
  }

  // --- Player Interactions ---
  function selectCard(index) {
    if (state.isEnemyTurn) return;
    state.selectedCardIndex = (state.selectedCardIndex === index) ? null : index;
    // if (typeof JAMengine !== 'undefined') JAMengine.playSFX('tapp', 0.6);
    renderHand();
  }

  function playCard(slotIndex) {
    if (state.selectedCardIndex === null || state.isEnemyTurn) return;
    
    let card = state.hand[state.selectedCardIndex];

    if (state.board[slotIndex] !== null) return; // Slot full
    if (state.energy < card.cost) {
      document.getElementById('stat-energy').classList.add('glitch');
      setTimeout(() => document.getElementById('stat-energy').classList.remove('glitch'), 300);
      return; 
    }

    state.energy -= card.cost;
    
    if (card.type === 'skill') {
       if (card.title === 'LUCID DREAM') state.hp = Math.min(state.maxHp, state.hp + card.val);
       // Skill cards go straight to discard
       state.discardPile.push(card);
    } else {
       // Attack or Defense goes to board
       // Create a copy of the card so HP modifications don't ruin the master deck!
       state.board[slotIndex] = {...card}; 
    }
    
    // Remove from hand
    state.hand.splice(state.selectedCardIndex, 1);
    state.selectedCardIndex = null;

    updateHUD();
    renderBoard();
    renderHand();
    // if (typeof JAMengine !== 'undefined') JAMengine.playSFX('place_card');
  }

  // Start the game!
  initBattle();
</script>
</body>
</html>
