<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SECWATCH Control</title>
<link rel="manifest" href="control.webmanifest">
<meta name="theme-color" content="#141414">
<link rel="stylesheet" href="css/tools.css">
<style>
  html,body{ height:100%; overflow:hidden; }
  #app{ display:grid; grid-template-rows:auto 1fr auto; height:100%; }
  #top .title{ color:var(--amber); font-size:16px; letter-spacing:.08em; }
  #top .file{ color:var(--dim); }
  #top .dirty{ color:var(--amber2); }
  #main{ display:grid; grid-template-columns:auto 1fr 380px; min-height:0; }
  #modes{ display:flex; flex-direction:column; gap:2px; padding:6px; background:var(--panel); border-right:1px solid var(--line); }
  #modes button{ text-align:left; width:108px; }
  #center{ position:relative; min-width:0; min-height:0; background:#0c0c0c; }
  #map{ position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  #side{ background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:10px; }
  #status{ padding:4px 10px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pal{ display:grid; grid-template-columns:repeat(2, 1fr); gap:4px; }
  .pal button{ display:flex; align-items:center; gap:6px; text-align:left; font-size:12px; padding:4px 6px; }
  .sw{ width:16px; height:16px; border:1px solid #000; flex:none; image-rendering:pixelated; }
  .row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:4px 0; }
  .row > label{ min-width:74px; }
  .row input[type=text], .row select{ flex:1; min-width:0; }
  .lst{ border:1px solid var(--line); max-height:260px; overflow:auto; }
  .lst div{ padding:4px 6px; border-bottom:1px solid var(--line); cursor:pointer; font-size:12px; }
  .lst div:hover{ background:#2a2a2a; }
  .lst div.sel{ background:#2e2618; color:var(--amber2); }
  .act{ border:1px solid var(--line); border-radius:3px; padding:6px; margin:6px 0; background:#1a1a1a; }
  .act .hd{ display:flex; gap:4px; align-items:center; }
  .act .hd select{ flex:1; }
  .act textarea{ margin-top:4px; font-size:12px; }
  .act.err{ border-color:var(--red); }
  .script{ font-size:12px; line-height:1.5; }
  .script .tr{ padding:6px; border-bottom:1px solid var(--line); cursor:pointer; }
  .script .tr:hover{ background:#222; }
  .script .w{ color:var(--blue); }
  .script .who{ color:var(--amber2); }
  .script .card{ color:#cfc8b4; white-space:pre-wrap; border-left:2px solid var(--line2); padding-left:6px; margin:2px 0; }
  .help{ font-size:12px; color:var(--dim); margin:4px 0 8px; }
  .menu{ position:absolute; background:var(--panel2); border:1px solid var(--line2); z-index:20; min-width:240px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  .menu div{ padding:6px 10px; cursor:pointer; }
  .menu div:hover{ background:#3a3020; color:var(--amber2); }
  .seg{ display:inline-flex; } .seg button{ border-radius:0; margin-left:-1px; }
  .pick{ outline:2px solid var(--green); }
  #toast{ position:fixed; bottom:34px; left:50%; transform:translateX(-50%); background:#2e2618; border:1px solid var(--amber); color:var(--amber2); padding:8px 14px; display:none; z-index:30; }
  @media (max-width:1000px){ #main{ grid-template-columns:auto 1fr; } #side{ position:fixed; right:0; top:44px; bottom:24px; width:min(380px, 92vw); z-index:15; display:none; } #side.open{ display:block; } #sideToggle{ display:inline-block !important; } }
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="top">
    <span class="title">SECWATCH CONTROL</span>
    <button id="bNew" title="New level">New</button>
    <button id="bOpen" title="Open a level file">Open…</button>
    <button id="bBuilt">Levels ▾</button>
    <button id="bFolder" title="Pick the secwatch folder so Save writes straight into levels/">Project folder…</button>
    <button id="bSave" class="primary" title="Ctrl+S">Save</button>
    <button id="bSaveAs">Save as…</button>
    <span class="seg"><button id="bUndo" title="Ctrl+Z">↶</button><button id="bRedo" title="Ctrl+Y">↷</button></span>
    <button id="bPlay" class="primary" title="Ctrl+Enter">▶ Playtest</button>
    <button id="bPlayHere" title="Click the map to choose where you start">▶ from here</button>
    <span class="file" id="fileLbl"></span>
    <span class="sp"></span>
    <span id="valid"></span>
    <button id="sideToggle" style="display:none">Panel</button>
    <a class="btn" href="art/mine_sheets.html" target="_blank">Sprite sheets</a>
    <a class="btn" href="docs/EDITOR.md" target="_blank">Help</a>
    <a class="btn" href="index.html">Dashboard</a>
  </div>
  <div id="main">
    <div id="modes">
      <button data-m="tiles">TILES</button>
      <button data-m="things">THINGS</button>
      <button data-m="zones">ZONES</button>
      <button data-m="triggers">STORY</button>
      <button data-m="script">SCRIPT</button>
      <button data-m="level">LEVEL</button>
      <button data-m="json">JSON</button>
      <hr style="border-color:var(--line);width:100%">
      <button id="bView">View: colour</button>
      <button id="bGrid">Grid: on</button>
      <button id="bFit">Fit map</button>
    </div>
    <div id="center"><canvas id="map"></canvas></div>
    <div id="side"></div>
  </div>
  <div id="status">ready</div>
</div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script src="js/mineSheets.js"></script>
<script src="js/mineArt.js"></script>
<script src="js/mineLevel.js"></script>
<script src="js/control.js"></script>
</body>
</html>
